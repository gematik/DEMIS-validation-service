server.port=8080
# Import Base Configuration
spring.config.import=classpath:/base-config-application.yaml
# Set Base Properties
base.errorhandler.enabled=false
base.feign.extension.enabled=false
base.logging.request.enabled=true
base.meter.aspect.enabled=true
## Actuator Configuration
management.observations.key-values.application=@project.name@
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Enable Exposing of Information over /actuator/info
management.info.env.enabled=true
# Information for the /info Endpoint
info.app.name=@project.name@
info.app.version=@project.version@
# Enable Spring Virtual Threads
spring.threads.virtual.enabled=true

# Validation Settings, aka. config options
demis.validation-service.profiles.basepath=${FHIR_PROFILES_BASEPATH:}
demis.validation-service.profiles.fhirpath=Fhir
demis.validation-service.profiles.versions=${PACKAGE_VERSIONS:}
demis.validation-service.terminology-server.enabled=${FEATURE_FLAG_TERMINOLOGY_SERVER:false}
demis.validation-service.terminology-server.url=${CONFIG_OPTION_TERMINOLOGY_SERVER_URL:}
demis.validation-service.locale=en_US
demis.validation-service.minSeverityOutcome=warning
demis.validation-service.unexpected-extension-severity=warning
demis.validation-service.additional-strict-coding-validator-enabled=${CONFIG_OPTION_ADDITIONAL_STRICT_CODING_VALIDATOR_ENABLED:false}
demis.validation-service.common-code-system-terminology-enabled=${CONFIG_OPTION_COMMON_CODE_SYSTEM_TERMINOLOGY_ENABLED:false}
demis.validation-service.custom-regex-validator-enabled=${CONFIG_OPTION_CUSTOM_REGEX_VALIDATOR_ENABLED:false}
demis.validation-service.custom-quantity-validator-enabled=${CONFIG_OPTION_CUSTOM_QUANTITY_VALIDATOR_ENABLED:false}
demis.validation-service.resource-references.trusted-external-domains=${CONFIG_OPTION_TRUSTED_EXTERNAL_REFERENCES_DOMAINS:}

# flags
feature.flag.format-validation-enabled=${FEATURE_FLAG_FORMAT_VALIDATION_ENABLED:true}
feature.flag.filtered-errors-as-warnings-disabled=${FEATURE_FLAG_FILTERED_ERRORS_AS_WARNINGS_DISABLED:false}
feature.flag.codesystem-version-verification-enabled=${FEATURE_FLAG_CODESYSTEM_VERSION_VERIFICATION_ENABLED:false}
feature.flag.vs-hapi-qr-qmin-verification-enabled=${FEATURE_FLAG_VS_HAPI_QR_QMIN_VERIFICATION_ENABLED:false}
feature.flag.address-country-errors-as-warnings-disabled=${FEATURE_FLAG_ADDRESS_COUNTRY_ERRORS_AS_WARNINGS_DISABLED:false}
feature.flag.address-state-errors-as-warnings-disabled=${FEATURE_FLAG_ADDRESS_STATE_ERRORS_AS_WARNINGS_DISABLED:false}
feature.flag.address-zip-errors-as-warnings-disabled=${FEATURE_FLAG_ADDRESS_ZIP_ERRORS_AS_WARNINGS_DISABLED:false}
feature.flag.vs-reference-validation=${FEATURE_FLAG_VS_REFERENCE_VALIDATION:false}
feature.flag.abstract-profile-validation=${FEATURE_FLAG_ABSTRACT_PROFILE_VALIDATION:false}
feature.flag.reference-profile-validation=${FEATURE_FLAG_REFERENCE_PROFILE_VALIDATION:false}
feature.flag.fhir-package-postprocessing=${FEATURE_FLAG_FHIR_PACKAGE_POSTPROCESSING:false}
feature.flag.hl7-issue-2876-fixed=${FEATURE_FLAG_HL7_ISSUE_2876_FIXED:false}
